name: Browser Smoke

on:
  push:
    branches:
      - main
      - fix/fullscreen-battle-20260803
      - fix/pvp-wilderness-room-20260805
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-smoke:
    name: Playwright smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=moderate

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run browser smoke test
        run: npx playwright test

      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
