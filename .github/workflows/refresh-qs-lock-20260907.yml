name: Refresh audited qs lock

on:
  push:
    branches:
      - fix/pvp-boss-visual-sync-20260906
    paths:
      - .github/workflows/refresh-qs-lock-20260907.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Refresh only compatible qs lock resolution
        run: |
          npm update qs --package-lock-only --ignore-scripts
          node -e "const p=require('./package-lock.json').packages['node_modules/qs']; if (p?.version !== '6.16.0') { throw new Error('expected qs 6.16.0, got ' + p?.version); }"
          npm audit --omit=dev --audit-level=moderate

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
          else
            git commit -m "chore: refresh audited qs lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
