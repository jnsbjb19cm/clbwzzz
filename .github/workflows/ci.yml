name: CI

on:
  push:
    branches:
      - main
      - fix/fullscreen-battle-20260803
      - fix/pvp-wilderness-room-20260805
      - fix/pvp-boss-visual-sync-20260906
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-and-build:
    name: Syntax, current regressions and Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report all dependency vulnerabilities
        continue-on-error: true
        run: npm audit --audit-level=moderate

      - name: Audit production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=moderate

      - name: Check JavaScript syntax
        run: node scripts/ci-syntax-check.mjs

      - name: Verify battle runtime contract
        run: node scripts/verify-battle-runtime-contract-20260906.mjs

      - name: Verify projectile runtime contract
        run: node scripts/verify-projectile-runtime-contract-20260906.mjs

      - name: Verify latest user battle regressions
        run: node scripts/verify-battle-user-regressions-20260906.mjs

      - name: Verify current user request contract
        run: node scripts/verify-user-request-20260906.mjs

      - name: Verify room chat lifecycle
        run: node scripts/verify-room-chat-lifecycle-20260906.mjs

      - name: Verify room invite and guild approval
        run: node scripts/verify-room-invite-guild-approval-20260906.mjs

      - name: Verify economy, smithy and guild authority
        run: node scripts/verify-economy-smithy-guild-20260907.mjs

      - name: Verify 2026-09-08 user regressions
        run: node scripts/verify-user-regressions-20260908.mjs

      - name: Verify guild role, task pin persistence and hidden skill
        run: node scripts/verify-guild-task-pin-skilltree-20260908.mjs

      - name: Verify database-first economy persistence
        run: node scripts/verify-database-persistence-authority-20260908.mjs

      - name: Verify level 4 charm and collapsible classic chat
        run: node scripts/verify-smithy-charm-chat-polish-20260908.mjs

      - name: Verify debug hit circles stay removed
        run: node scripts/verify-remove-hit-debug-circles-20260905.mjs

      - name: Verify authority smoothing performance
        run: node scripts/verify-authority-smooth-performance-20260905.mjs

      - name: Verify high-star render performance contract
        run: node scripts/verify-high-star-render-performance-20260905.mjs

      - name: Build production bundle
        run: npm run build:deploy