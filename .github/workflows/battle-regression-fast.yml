name: Battle Regression Fast

on:
  push:
    branches:
      - fix/pvp-wilderness-room-20260805
      - fix/pvp-boss-visual-sync-20260906
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: battle-regression-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest-rules:
    name: Latest battle rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Commander targeting
        run: node scripts/verify-boss-commander-targeting-20260819.mjs

      - name: Fly shoe first-contact stun
        run: node scripts/verify-fly-shoe-regression.mjs

      - name: Battle rules continuation
        run: node scripts/verify-battle-rules-continuation-20260831.mjs

      - name: Production placement install order
        run: node scripts/verify-production-placement-install-order-20260819.mjs

      - name: Authority projectile release latency
        run: node scripts/verify-authority-projectile-release-latency-20260819.mjs

      - name: Projectile spawn event protocol
        run: node scripts/verify-projectile-spawn-event-protocol-20260819.mjs
