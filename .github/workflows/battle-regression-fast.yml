name: Battle Regression Fast

on:
  push:
    branches:
      - fix/pvp-boss-visual-sync-20260906
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: battle-regression-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest-rules:
    name: Latest battle rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify commander, fly-shoe and production battle rules
        run: node scripts/verify-battle-runtime-contract-20260906.mjs
