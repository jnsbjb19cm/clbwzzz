name: Projectile Regression Fast

on:
  push:
    branches:
      - fix/pvp-boss-visual-sync-20260906
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: projectile-regression-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  projectile-browser:
    name: Projectile browser continuity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Verify projectile authority protocol and timeline
        run: node scripts/verify-projectile-runtime-contract-20260906.mjs

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium browser only
        run: npx playwright install chromium

      - name: Run projectile continuity regressions
        run: npx playwright test --config=playwright.projectile.config.mjs
