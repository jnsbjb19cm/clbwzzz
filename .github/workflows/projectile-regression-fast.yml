name: Projectile Regression Fast

on:
  push:
    branches:
      - fix/pvp-wilderness-room-20260805
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: projectile-regression-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  projectile-browser:
    name: Projectile browser continuity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify server timeline protocol
        run: node scripts/verify-projectile-spawn-event-protocol-20260819.mjs

      - name: Verify frame-rate independent projectile timeline
        run: node scripts/verify-projectile-server-timeline-20260819.mjs

      - name: Verify authority cadence no longer uses 20Hz projectile motion
        run: node scripts/verify-authority-projectile-release-latency-20260819.mjs

      - name: Install Chromium browser only
        run: npx playwright install chromium

      - name: Run projectile continuity regressions
        run: npx playwright test --config=playwright.projectile.config.mjs
