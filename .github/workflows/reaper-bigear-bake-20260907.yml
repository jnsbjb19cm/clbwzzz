name: Reaper Big-Ear Bake

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reaper-bigear-bake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebake:
    name: Re-bake 31/57 and preserve dark details
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture checked-in baseline
        run: |
          mkdir -p /tmp/unit-bake-baseline
          cp assets/sprites/unit_anim/31.png /tmp/unit-bake-baseline/31.png
          cp assets/sprites/unit_anim/57.png /tmp/unit-bake-baseline/57.png

      - name: Re-bake jumping big-ear and reaper
        run: node scripts/bake-soldier-animations.mjs 31 57

      - name: Verify dark facial details survive
        run: node scripts/verify-reaper-bigear-bake-20260907.mjs /tmp/unit-bake-baseline

      - name: Upload re-baked unit assets
        uses: actions/upload-artifact@v4
        with:
          name: reaper-bigear-bake-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            assets/sprites/unit_anim/31.png
            assets/sprites/unit_anim/31.json
            assets/sprites/unit_anim/57.png
            assets/sprites/unit_anim/57.json
            assets/sprites/unit_anim/manifest.json

      - name: Commit verified 31/57 assets when changed
        shell: bash
        run: |
          git add assets/sprites/unit_anim/31.png assets/sprites/unit_anim/31.json \
                  assets/sprites/unit_anim/57.png assets/sprites/unit_anim/57.json
          if git diff --cached --quiet; then
            echo '31/57 baked assets already match the verified output.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: persist verified reaper and big-ear baked assets'
          TARGET_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${TARGET_BRANCH}"
